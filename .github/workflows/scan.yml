name: Comprobar fuentes de subastas
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'sources.json'
      - '.github/workflows/scan.yml'
  workflow_dispatch:
  schedule:
    - cron: '20 6 * * *'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Verificar sintaxis del rastreador
        run: python -m compileall -q src
      - name: Ejecutar consulta BOE
        timeout-minutes: 45
        run: python src/scan.py
      - name: Guardar estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status.json data/candidates.json docs/data/
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar estado de fuentes"
            git push
          fi

name: Comprobar fuentes de subastas
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'sources.json'
      - '.github/workflows/scan.yml'
  workflow_dispatch:
  schedule:
    - cron: '20 6 * * *'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python src/scan.py
      - name: Guardar estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status.json docs/data/
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar estado de fuentes"
            git push
          fi

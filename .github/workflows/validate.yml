name: Validación de desarrollo
on:
  push:
    branches:
      - development/validated-scanner
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -v
      - name: Ejecutar extracción completa de Toledo
        run: python src/scan.py
      - name: Comprobar acceso real a fuentes públicas
        run: python src/probe.py
      - name: Conservar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-report-${{ github.run_id }}
          path: probe-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Conservar prueba de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.run_id }}
          path: |
            data/status.json
            data/diagnostics.json
          if-no-files-found: error
          retention-days: 30

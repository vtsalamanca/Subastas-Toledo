<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subastas Toledo</title><style>body{font:16px system-ui;max-width:900px;margin:auto;padding:20px;background:#f6f7f9;color:#202630}main{background:white;padding:20px;border-radius:14px}input{font:inherit;padding:10px;max-width:100%}.muted{color:#626b78}li{margin:14px 0}small{display:block;margin-top:4px}.ok{color:#176b35}</style></head><body><main><h1>Subastas inmobiliarias · Toledo</h1><p class="muted">Extracción de la información pública del Portal de Subastas del BOE. Comprueba siempre la ficha oficial antes de tomar una decisión.</p><label>Municipio <input id="city" placeholder="Toledo, Illescas…"></label><p id="summary">Cargando datos…</p><ul id="results"></ul><h2>Prueba de cobertura</h2><p id="coverage"></p><h2>Estado de fuentes</h2><ul id="sources"></ul></main><script>
let goods=[];const el=id=>document.getElementById(id);const first=(obj,key)=>(obj?.[key]||[])[0]||'';function render(){const q=el('city').value.toLocaleLowerCase('es');const filtered=goods.filter(x=>x.localidad.toLocaleLowerCase('es').includes(q));el('results').replaceChildren();for(const item of filtered){const li=document.createElement('li');li.textContent=[item.localidad,item.tipo,item.direccion].filter(Boolean).join(' · ');const a=document.createElement('a');a.href=item.url;a.textContent=' · Ver ficha oficial';a.rel='noopener noreferrer';a.target='_blank';li.append(a);if(item.lote){const small=document.createElement('small');small.textContent='Lote '+item.lote+' · '+item.referencia;li.append(small)}el('results').append(li)}el('summary').textContent=filtered.length+' bienes públicos estructurados.'}el('city').addEventListener('input',render);Promise.all([fetch('data/results.json').then(r=>{if(!r.ok)throw Error('resultados');return r.json()}),fetch('data/status.json').then(r=>{if(!r.ok)throw Error('estado');return r.json()})]).then(([auctions,status])=>{goods=auctions.flatMap(auction=>auction.bienes.map(good=>({referencia:auction.referencia,url:auction.url,lote:good.lote||'',tipo:good.titulo,localidad:first(good.campos,'Localidad'),direccion:first(good.campos,'Dirección')})));render();const c=status.coverage||{};el('coverage').className=c.complete?'ok':'';el('coverage').textContent=`${c.extracted_unique||0} de ${c.declared_total||0} subastas; ${c.details_readable||0} fichas legibles; ${c.goods_extracted||0} bienes; ${c.details_failed||0} errores.`;el('sources').replaceChildren();for(const source of status.sources||[]){const li=document.createElement('li');li.textContent=source.id+': '+source.status+(source.reason?' — '+source.reason:'');el('sources').append(li)}}).catch(error=>el('summary').textContent='No se pudieron cargar los datos: '+error.message);
</script></body></html>

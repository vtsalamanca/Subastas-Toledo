<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subastas Toledo</title><style>body{font:16px system-ui;max-width:760px;margin:auto;padding:20px;background:#f6f7f9;color:#202630}main{background:white;padding:20px;border-radius:14px}input,select{font:inherit;padding:10px;max-width:100%}.muted{color:#626b78}li{margin:12px 0}</style></head><body><main><h1>Subastas inmobiliarias · Toledo</h1><p class="muted">Solo se muestran anuncios verificados. La ausencia de anuncios no significa que no existan subastas.</p><label>Municipio <input id="city" placeholder="Toledo, Nambroca…"></label><p id="summary">Cargando datos…</p><ul id="results"></ul><h2>Estado de fuentes</h2><ul id="sources"></ul></main><script>
let listings=[];const el=id=>document.getElementById(id);function render(){const q=el('city').value.toLocaleLowerCase('es');const filtered=listings.filter(x=>String(x.municipio||'').toLocaleLowerCase('es').includes(q));el('results').replaceChildren();for(const item of filtered){const li=document.createElement('li');li.textContent=[item.municipio,item.descripcion,item.precio].filter(Boolean).join(' · ');if(item.url&&/^https:\/\//.test(item.url)){const a=document.createElement('a');a.href=item.url;a.textContent=' · Ver fuente';a.rel='noopener noreferrer';a.target='_blank';li.append(a)}el('results').append(li)}el('summary').textContent=filtered.length+' anuncios verificados en los datos publicados.'}el('city').addEventListener('input',render);Promise.all([fetch('../data/results.json').then(r=>{if(!r.ok)throw Error('resultados');return r.json()}),fetch('../data/status.json').then(r=>{if(!r.ok)throw Error('estado');return r.json()})]).then(([a,b])=>{listings=Array.isArray(a)?a:[];render();el('sources').replaceChildren();for(const s of b.sources||[]){const li=document.createElement('li');li.textContent=s.id+': '+s.status+(s.reason?' — '+s.reason:'');el('sources').append(li)}}).catch(e=>el('summary').textContent='No se pudieron cargar los datos: '+e.message);
</script></body></html>
